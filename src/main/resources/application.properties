spring.application.name=QLNS
spring.datasource.url=jdbc:mysql://localhost:3306/qlnsfinal_vv?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080

# JWT Configuration
# Secret key for signing JWT tokens (change this in production!)
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationPurposeOnly12345678901234567890

# JWT token expiration time in milliseconds
jwt.expiration=90000000

# Logging
logging.level.com.example.qlns=INFO
logging.level.org.springframework.security=DEBUG

# [Chat] File upload configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

